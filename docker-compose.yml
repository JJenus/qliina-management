services:
  postgres:
    image: postgres:16-alpine
    container_name: laundry-postgres
    environment:
      POSTGRES_DB: qliina_db
      POSTGRES_USER: laundry_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - laundry-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laundry_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: laundry-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Never default to the `test` profile here: it uses ddl-auto=create-drop
      # on H2 (data loss on every restart). `dev` (Postgres in this compose
      # file, ddl-auto=update) or `prod` (env-only secrets) are the valid ones.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/qliina_db
      SPRING_DATASOURCE_USERNAME: laundry_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "8080:8080"
    networks:
      - laundry-network

volumes:
  postgres-data:

networks:
  laundry-network:
    driver: bridge
