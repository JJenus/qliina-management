spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.jjenus.qliina_management: INFO
    org.springframework: WARN

# All secrets MUST come from the environment in prod — placeholders below carry
# no default, so boot fails fast instead of silently using a committed value.
jwt:
  secret: ${JWT_SECRET}

server:
  port: ${PORT:8080}

app:
  # Cross-origin API calls are DENIED by default (fail-closed). Set
  # CORS_ALLOWED_ORIGINS to the exact deployed origin(s), e.g.
  # "https://sqliina.com,https://app.qliina.com,https://admin.qliina.com,https://qliina.vercel.app". Never "*" with credentials.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # Platform-admin bootstrap is OFF in prod by default — override with
  # SEED_ADMIN_ENABLED for a first-time bootstrap only. Password is blank by
  # default: set SEED_ADMIN_PASSWORD or the seeder fails fast (the committed
  # convenience default is never used in prod). Permissions, roles and billing
  # plans (credential-free reference data) always seed in every profile.
  seed-data:
    admin:
      enabled: ${SEED_ADMIN_ENABLED:false}
      password: ${SEED_ADMIN_PASSWORD:}
  billing:
    gateway:
      simulator:
        secret: ${BILLING_GATEWAY_SECRET}
  notification:
    channels:
      # SMS/Push/WhatsApp adapters are not wired in prod yet — fail closed
      # (CHANNEL_SEND_UNIMPLEMENTED) rather than silently faking deliveries.
      mock-external: false
  payments:
    currency: ${PAYMENTS_CURRENCY:NGN}
    providers:
      simulator:
        # Sandbox checkout is never live in prod. Flip only for staging-ish hosts.
        enabled: ${PAYMENTS_SIMULATOR_ENABLED:false}
        secret: ${PAYMENTS_SIMULATOR_SECRET}
      paystack:
        secret-key: ${PAYSTACK_SECRET_KEY:}
        public-key: ${PAYSTACK_PUBLIC_KEY:}
      flutterwave:
        secret-key: ${FLUTTERWAVE_SECRET_KEY:}
        public-key: ${FLUTTERWAVE_PUBLIC_KEY:}
        # verif-hash set in the Flutterwave dashboard; without it webhooks fail closed.
        webhook-secret: ${FLUTTERWAVE_WEBHOOK_SECRET:}

encryption:
  secret: ${ENCRYPTION_SECRET}
  salt: ${ENCRYPTION_SALT}
  iteration-count: 65536
  key-length: 256
  enabled: true