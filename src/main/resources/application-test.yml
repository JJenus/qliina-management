spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  h2:
    console:
      enabled: true

# Seed the demo tenant ("Qliina Demo Laundry") with all roles, orders, etc.
# Integration tests opt out via @TestPropertySource(app.seed-demo.enabled=false).
app:
  seed-demo:
    enabled: true

logging:
  level:
    com.jjenus.qliina_management: DEBUG

server:
  port: 8081
