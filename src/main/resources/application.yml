spring:
  application:
    name: qliina_management
  profiles:
    active: test
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: true
    baseline-version: 0
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterAccess=600s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000 # 24 hours in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds

# Billing engine configuration
app:
  billing:
    gateway:
      simulator:
        secret: ${BILLING_GATEWAY_SECRET:sim-secret}
    simulator:
      failure-mode: ${BILLING_SIMULATOR_FAILURE_MODE:NONE} # NONE | ALL (tests inject programmatically)
    schedule:
      renewal: ${BILLING_SCHEDULE_RENEWAL:0 15 * * * *}
      dunning: ${BILLING_SCHEDULE_DUNNING:0 45 * * * *}
      trial: ${BILLING_SCHEDULE_TRIAL:0 30 * * * *}
      cancellation: ${BILLING_SCHEDULE_CANCELLATION:0 5 * * * *}
    dunning:
      schedule: ${BILLING_DUNNING_SCHEDULE:1,3,7,14}

# Encryption Configuration
encryption:
  secret: ${ENCRYPTION_SECRET:tWHKe8dL9FTumZynTVF8UDYruDUiODdOh0WWLt7fY0I=}
  salt: ${ENCRYPTION_SALT:f14ecc5ca42ba522a1f5a38df1564282}
  iteration-count: 65536
  key-length: 256
  enabled: true

logging:
  level:
    com.jjenus.qliina_management: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    operationsSorter: method
    tagsSorter: alpha
  packages-to-scan: com.jjenus.qliina_management
  #paths-to-match: /api/**
