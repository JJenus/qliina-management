spring:
  application:
    name: qliina_management
  profiles:
    active: test
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterAccess=600s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  
server:
  port: 8080
  error:
    # Full messages are only surfaced in dev/test profiles (which opt in); the
    # default here is fail-closed so no environment accidentally leaks internal
    # (e.g. SQL/validation) messages to clients. Callers rely on errorCode.
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

jwt:
  # No default — must come from the environment (JWT_SECRET) in any environment
  # beyond local dev/test (which set their own explicit value in profile YAMLs).
  # A committed/tutorial fallback would let tokens be forged.
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 hours in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds

# Billing engine configuration
app:
  seed-data:
    admin:
      # Admin bootstrap is OFF by default. Enabling it in dev/test (profile YAML)
      # or via SEED_ADMIN_ENABLED for a one-time prod bootstrap keeps the known
      # default password out of every non-prod environment.
      enabled: ${SEED_ADMIN_ENABLED:false}
      password: ${SEED_ADMIN_PASSWORD:}
  billing:
    gateway:
      simulator:
        # No committed default — the dev/test profiles pin the simulator secret.
        secret: ${BILLING_GATEWAY_SECRET}
    simulator:
      failure-mode: ${BILLING_SIMULATOR_FAILURE_MODE:NONE} # NONE | ALL (tests inject programmatically)
    schedule:
      renewal: ${BILLING_SCHEDULE_RENEWAL:0 15 * * * *}
      dunning: ${BILLING_SCHEDULE_DUNNING:0 45 * * * *}
      trial: ${BILLING_SCHEDULE_TRIAL:0 30 * * * *}
      cancellation: ${BILLING_SCHEDULE_CANCELLATION:0 5 * * * *}
    dunning:
      schedule: ${BILLING_DUNNING_SCHEDULE:1,3,7,14}
  notification:
    scheduler:
      enabled: ${NOTIFICATION_SCHEDULER_ENABLED:true}
    delivery:
      max-attempts: ${NOTIFICATION_DELIVERY_MAX_ATTEMPTS:5}
    outbox:
      max-attempts: ${NOTIFICATION_OUTBOX_MAX_ATTEMPTS:10}
      lease-timeout-ms: ${NOTIFICATION_OUTBOX_LEASE_TIMEOUT_MS:300000}
    channels:
      # Sandbox gate for the notification channels (SMS/Push/WhatsApp). The
      # provider adapters are not wired yet: true (dev/test default) simulates
      # a successful send; false fails closed (CHANNEL_SEND_UNIMPLEMENTED)
      # instead of pretending a message was delivered. Prod MUST keep this false.
      mock-external: ${NOTIFICATION_MOCK_CHANNELS:true}
  rate-limit:
    default-limit:
      capacity: ${RATE_LIMIT_DEFAULT_CAPACITY:100}
      refill-per-minute: ${RATE_LIMIT_DEFAULT_REFILL:60}
    login:
      capacity: ${RATE_LIMIT_LOGIN_CAPACITY:20}
      refill-per-minute: ${RATE_LIMIT_LOGIN_REFILL:10}
  payments:
    currency: ${PAYMENTS_CURRENCY:NGN}
    pending-expiry-hours: ${PAYMENTS_PENDING_EXPIRY_HOURS:24}
    pending-expiry-cron: ${PAYMENTS_PENDING_EXPIRY_CRON:0 15 3 * * *}
    providers:
      simulator:
        enabled: ${PAYMENTS_SIMULATOR_ENABLED:true} # false in prod (sandbox never live)
        # Dev/test profile pins the simulator secret; prod provides its own.
        secret: ${PAYMENTS_SIMULATOR_SECRET}
        failure-mode: ${PAYMENTS_SIMULATOR_FAILURE_MODE:NONE} # NONE | ALL (tests inject programmatically)
      paystack:
        secret-key: ${PAYSTACK_SECRET_KEY:}
        public-key: ${PAYSTACK_PUBLIC_KEY:}
      flutterwave:
        secret-key: ${FLUTTERWAVE_SECRET_KEY:}
        public-key: ${FLUTTERWAVE_PUBLIC_KEY:}
        webhook-secret: ${FLUTTERWAVE_WEBHOOK_SECRET:}

# Encryption Configuration
# No committed key/salt — must come from the environment (or explicit profile
# YAMLs for dev/test). A static checked-in key would let anyone decrypt the
# BYO payment-provider credentials stored at rest.
encryption:
  secret: ${ENCRYPTION_SECRET}
  salt: ${ENCRYPTION_SALT}
  iteration-count: 65536
  key-length: 256
  enabled: true

logging:
  level:
    com.jjenus.qliina_management: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        # Publicly reachable: /actuator/health only (already permitAll in
        # SecurityConfig); metrics/prometheus are exposed but require auth
        # (not permitAll).  Dev/test may widen this via profile YAML.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Leaks datasource/disk state when 'always'; use 'never' as the baseline
      # and only widen in dev/test profiles where operators need it.
      show-details: never

springdoc:
  swagger-ui:
    operationsSorter: method
    tagsSorter: alpha
  packages-to-scan: com.jjenus.qliina_management
  #paths-to-match: /api/**
